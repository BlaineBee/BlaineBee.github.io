<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.summary | default: site.description | escape }}">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0d12">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.summary | default: site.description | escape }}">
<meta property="og:type" content="website">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script>document.documentElement.classList.add('js');</script>
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
