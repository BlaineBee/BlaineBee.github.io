---
layout: default
---
<section class="page-hero container reveal">
  {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
  <h1>{{ page.title }}</h1>
  {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  {% if site.data.profile.resume_pdf %}
  <div class="hero-actions">
    <a class="btn btn-primary" href="{{ site.data.profile.resume_pdf | relative_url }}" download>Download PDF</a>
    <a class="btn btn-ghost" href="{{ site.data.profile.resume_pdf | relative_url }}" target="_blank" rel="noopener">Open in new tab</a>
  </div>
  {% endif %}
</section>
<div class="container resume-wrap reveal">
  {% if site.data.profile.resume_pdf %}
  <object class="resume-frame" data="{{ site.data.profile.resume_pdf | relative_url }}" type="application/pdf" aria-label="Resume PDF">
    <div class="pdf-fallback">
      <p>Your browser can't show the PDF here.</p>
      <a class="btn btn-primary" href="{{ site.data.profile.resume_pdf | relative_url }}">Open the resume PDF</a>
    </div>
  </object>
  {% endif %}
  {{ content }}
</div>
